[project]
name = "fdpneo-index"
version = "0.1.0.dev0"
description = "FDPneo Index — a directory of FAIR Data Points: ping intake, reachability, harvest and administration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "FDP Contributors" },
]
keywords = ["fair", "fdp", "index", "metadata", "rdf", "dcat", "directory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  # HTTP / API
  "fastapi[standard]>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.14.2",  # floor clears GHSA-4xgf-cpjx-pc3j (pip-audit gate)
  "uvicorn[standard]>=0.30",
  # Transitive via fastapi; floors clear advisories (pip-audit gate), as in fdpneo-server.
  "starlette>=1.3.1",
  "python-multipart>=0.0.31",
  "httpx>=0.27",
  # RDF. Keep rdflib >= 7: it neutralizes RDF/XML external-entity expansion on
  # untrusted input, and everything the index parses comes from the network.
  "rdflib>=7.0",
  # Identity: OIDC bearer tokens (ADR-0003). Floors as in fdpneo-server.
  "pyjwt[crypto]>=2.15.0",
  "cryptography>=50.0.0",
  # Storage
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  # Observability
  "structlog>=24.2",
  # CLI
  "typer>=0.12",
  "pyoxigraph>=0.5.13,<0.6",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.15",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "respx>=0.21",
  "aiosqlite>=0.20",  # in-memory async DB for unit tests that exercise SQL
  "types-pyyaml>=6.0.12.20261113",
]

[project.scripts]
fdpindex = "fdpindex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdpindex"]

# ----------------------------------------------------------------------------
# Ruff — lint and format (same rules as fdpneo-server)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "ASYNC",
  "PTH",  # use pathlib
  "TID",  # tidy imports
  "ARG",  # unused arguments
]
ignore = [
  "E501",   # line length — handled by formatter
  "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"src/fdpindex/cli.py" = ["B008"]  # typer uses function defaults heavily
"src/fdpindex/api/*.py" = ["B008"]  # FastAPI Depends() in argument defaults is the idiomatic pattern
"src/fdpindex/auth.py" = ["B008"]
"src/fdpindex/errors.py" = ["N818"]  # HTTP-style names (NotFound, Forbidden, …) are intentional
"src/fdpindex/sparql/*.py" = ["N818", "ASYNC109"]  # outcome-style error names; worker calls take explicit time budgets
"src/fdpindex/api/sparql.py" = ["N818", "B008"]
"src/fdpindex/api/search.py" = ["N818", "B008"]
"src/fdpindex/search/*.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["fdpindex"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
exclude = ["**/*.md"]

# ----------------------------------------------------------------------------
# Pyright — type checking
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "src/fdpindex/migrations/versions"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportPrivateUsage = false

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "unit: fast tests with no I/O",
  "integration: tests that spin up containers (testcontainers)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
